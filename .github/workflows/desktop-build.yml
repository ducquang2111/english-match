name: Build English Match Desktop
on:
  push:
    branches: [english-match-desktop]
    paths: ['desktop/**', '.github/workflows/desktop-build.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: ${{ matrix.name }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows-x64
            os: windows-2022
            arch: x64
            target: win
          - name: Mac-Intel
            os: macos-15-intel
            arch: x64
            target: mac
          - name: Mac-Apple-Silicon
            os: macos-15
            arch: arm64
            target: mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
      - name: Install build tools
        run: |
          python -m pip install pyinstaller==6.22.3
          npm ci --no-audit --no-fund
      - name: Check existing app and desktop protections
        run: |
          python -m unittest discover -s backend/tests -v
          npm test
          python scripts/smoke-backend.py
      - name: Bundle native Python backend
        run: python scripts/build-backend.py
      - name: Verify frozen backend and data persistence
        run: python scripts/smoke-backend.py --frozen
      - name: Package installer
        run: npm run dist -- --${{ matrix.target }} --${{ matrix.arch }}
      - name: Open packaged application twice and verify learning data
        run: python scripts/smoke-native.py
      - name: Installer checksums
        run: python -c "from pathlib import Path; import hashlib; p=Path('release'); files=[f for f in p.iterdir() if f.suffix in ('.exe','.dmg')]; (p/'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(f.read_bytes()).hexdigest()+'  '+f.name+'\n' for f in files),encoding='utf-8')"
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: English-Match-${{ matrix.name }}
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/SHA256SUMS.txt
            desktop/README.md
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Test-evidence-${{ matrix.name }}
          retention-days: 7
          path: desktop/test-results/
      - name: Prepare bounded file delivery
        run: python scripts/prepare-delivery.py
      - uses: actions/upload-artifact@v4
        with:
          name: Delivery-${{ matrix.name }}-manifest
          path: desktop/delivery/manifest.json
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: Delivery-${{ matrix.name }}-1
          path: desktop/delivery/part-1.bin
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: hashFiles('desktop/delivery/part-2.bin') != ''
        with:
          name: Delivery-${{ matrix.name }}-2
          path: desktop/delivery/part-2.bin
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: hashFiles('desktop/delivery/part-3.bin') != ''
        with:
          name: Delivery-${{ matrix.name }}-3
          path: desktop/delivery/part-3.bin
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: hashFiles('desktop/delivery/part-4.bin') != ''
        with:
          name: Delivery-${{ matrix.name }}-4
          path: desktop/delivery/part-4.bin
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: hashFiles('desktop/delivery/part-5.bin') != ''
        with:
          name: Delivery-${{ matrix.name }}-5
          path: desktop/delivery/part-5.bin
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: hashFiles('desktop/delivery/part-6.bin') != ''
        with:
          name: Delivery-${{ matrix.name }}-6
          path: desktop/delivery/part-6.bin
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: hashFiles('desktop/delivery/part-7.bin') != ''
        with:
          name: Delivery-${{ matrix.name }}-7
          path: desktop/delivery/part-7.bin
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: hashFiles('desktop/delivery/part-8.bin') != ''
        with:
          name: Delivery-${{ matrix.name }}-8
          path: desktop/delivery/part-8.bin
          compression-level: 0
          retention-days: 1
